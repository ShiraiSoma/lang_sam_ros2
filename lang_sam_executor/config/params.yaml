# リモートPC(GPU)で起動: lang_sam_server.launch.py (detector + trackerを1プロセスで)
lang_sam_detector:
  ros__parameters:
    sam_model: sam2.1_hiera_small
    text_prompt: "red ground. green pylon."   # 地面(追従)と障害物(回避)。lang_sam_ground_navのground_label/obstacle_labelと対応させる
    box_threshold: 0.3            # 検出(BBox)の信頼度閾値。↑で厳格、↓で検出増(誤検出も増)
    text_threshold: 0.25          # テキスト一致の閾値。↑で厳格、↓で検出増
    request_topic: /lang_sam/detect_request
    response_topic: /lang_sam/detections
    lite_topic: /lang_sam/detections_lite     # マスク抜きの検出結果(クライアント表示用。ros1_bridge/回線越しに送る)
    mask_topic: /lang_sam/detection_mask      # 検出マスク(16bit PNG。response_topicの非圧縮マスクの代わりにクライアントへ送る)
    visualize: false              # 検出ノード自身のウィンドウ表示。結果はlang_sam_clientで表示するため通常は不要

# リモートPC(GPU)で起動: lang_sam_server.launch.py (detector + trackerを1プロセスで)
lang_sam_tracker:
  ros__parameters:
    detection_interval_sec: 1.0   # 検出リクエスト送信間隔(秒)。↓で頻繁に再検出(通信・計算増=ドリフト矯正頻度↑)。新しく映ったパイロンに気づくまでの遅れもこれで決まる
    frame_topic: /lang_sam/frame               # lang_sam_clientから受け取るJPEGフレーム
    tracks_topic: /lang_sam/tracks             # 追跡結果(TrackArray)
    track_mask_topic: /lang_sam/track_mask     # 追跡結果のインデックスマスク(16bit PNG)
    detect_request_topic: /lang_sam/detect_request   # lang_sam_detectorへ送るトピック
    detect_response_topic: /lang_sam/detections       # lang_sam_detectorから受け取るトピック
    detect_timeout_multiplier: 3.0  # 検出応答タイムアウト = detection_interval_sec × この倍率

    # Cutie (VOSマスク伝播トラッカー)
    cutie_weights: ""             # 重みファイルパス。空なら~/.cache/cutie/に自動ダウンロード
    cutie_max_internal_size: 480  # 内部処理解像度の最小辺(px)。↓で高速/粗い、↑で精細/遅い。480が標準
    cutie_mem_every: 5            # メモリ記銘の間隔(フレーム)。↓で頑健/メモリ増、↑で軽量
    cutie_use_long_term: true     # 長期メモリ。長時間追跡でのメモリ肥大を抑制
    cutie_use_amp: false          # 混合精度(FP16)で高速化。精度は僅かに低下

    # トラック管理 (再検出とのマージ規則)
    merge_iou_threshold: 0.1          # 検出マスクと既存トラックを同一とみなすIoU。↑で厳格(ID分裂しやすい)、↓で緩い(誤マージ増)
    duplicate_overlap_threshold: 0.5  # 同一物体の多重登録とみなす重なり率(交差/小さい方の面積)。検出同士・新規vs既存の両方に適用。↓で厳格(重複減)
    track_max_detection_misses: 1     # 再検出で連続この回数裏付けがないトラックを削除(3回×2秒=約6秒)
    track_lost_frames: 10             # 伝播マスクが空のままこのフレーム数を超えたら削除(遮蔽・画面外対策)
    track_min_mask_area: 100          # これ未満の面積(px)のマスクは消失扱い(多重登録の残骸や誤伝播を淘汰)

# ロボット側PCで起動: lang_sam_client.launch.py
lang_sam_client:
  ros__parameters:
    image_topic: /image_raw                    # カメラ画像トピック名
    frame_topic: /lang_sam/frame               # lang_sam_trackerへ送るJPEGフレーム
    tracks_topic: /lang_sam/tracks
    track_mask_topic: /lang_sam/track_mask
    detections_topic: /lang_sam/detections     # 検出結果(左パネルの表示用)
    jpeg_quality: 85                           # 送信JPEG品質。↓で通信量減/追跡精度低下
    stream_max_fps: 0.0                        # 送信フレームレート上限。0で無制限(カメラのレート)。回線が細い場合に下げる
    frame_buffer_size: 300                     # 結果と対応付けるため保持する送信済みフレーム数(遅延が大きい場合は増やす)
    visualize: true                            # 結果ウィンドウを表示するか

lang_sam_person_following:
  ros__parameters:
    image_width: 640   # 画像の幅(使用)
    kp_angular: 0.002  # 角速度の比例ゲイン(使用)

# リモートPC(GPU)で起動: lang_sam_ground_nav.launch.py (/cmd_velはros1_bridge経由でロボットへ)
lang_sam_ground_nav:
  ros__parameters:
    # 画像サイズ
    image_width: 640          # 画像の幅(px)。lang_sam_clientが送るフレームの解像度に合わせる
    image_height: 480         # 画像の高さ(px)。障害物の近さ判定(bbox面積比)に使用

    # 検出ラベル(text_promptの語句と対応。トラックのラベルにこの文字列を含むものを使う。大小文字は無視)
    # 同じラベルのトラックが複数ある場合はbbox面積が最大のものを使う
    ground_label: "red ground"    # 地面追従に使うトラックのラベル
    obstacle_label: "green pylon" # 回避対象トラックのラベル
    ground_exclude_keywords: ["pylon"]  # これを含むラベルは地面の候補から除外("red ground pylon"のような地面と障害物をまとめた誤ラベル対策)

    # 地面の追従目標
    ground_target_mode: "mask_bottom"  # "bbox_center"=地面bboxの中心 / "mask_bottom"=地面マスクの下部(ロボットに近い側)の重心。曲がった通路ではmask_bottomが有利
    ground_bottom_ratio: 0.3           # mask_bottom: 地面bboxの下からこの割合の高さの帯の画素を使う。↓で足元重視
    ground_bottom_min_pixels: 200      # mask_bottom: 帯内の地面画素がこれ未満ならbbox中心にフォールバック

    # 走行速度・操舵ゲイン
    linear_speed: 0.5             # 通常走行時の並進速度(m/s)。パイロンは次の再検出(最大detection_interval_sec)+処理遅れの後に初めて認識されるため、速すぎると回避が間に合わない
    kp_angular_ground: 0.003      # 地面追従: 目標位置の画面中心からのずれ(px)→角速度の比例ゲイン
    kp_angular_avoid: 0.002       # 障害物回避: 寄せ残り(px)→角速度の比例ゲイン
    max_angular_z: 0.6            # 角速度の上限(rad/s)。地面追従・回避の両方に適用。↓で回転を抑制

    # 回避の開始・停止しきい値(障害物bboxの面積比)
    avoid_area_ratio_slow: 0.20   # これ以上で回避(操舵+減速)を開始。未満なら無視して地面追従を継続
    avoid_area_ratio_stop: 0.30   # これ以上で並進停止(その場で回頭のみ)

    # 回避動作(画面端へ寄せて通過)
    avoid_edge_target_ratio: 0.2  # 画面中央側のbbox端がこの割合(画面幅比)まで端に寄るまで旋回。↓で大きく避ける
    avoid_done_margin_ratio: 0.05 # 寄せ完了のヒステリシス幅(画面幅比)。完了後この分ずれるまで旋回に戻らない
    avoid_pass_speed_ratio: 0.5   # 寄せ完了後・消失後の通過中の速度比(linear_speedに対する)
    avoid_hold_sec: 0.2           # 障害物が画角から消えた後、向きを保持して前進を続ける秒数
    avoid_smooth_alpha: 0.4       # 障害物bbox端・面積の平滑化係数(0-1)。↓で滑らか(反応は遅れる)

    # 見失い・通信断時の挙動
    ground_lost_grace_sec: 0.7    # 地面が見えなくなっても直前の指令を維持する猶予(秒)。超えたら停止。↑で止まりにくいが、見失い時の停止が遅れる
    tracks_timeout_sec: 0.5       # tracksがこの秒数届かなければ停止指令を出す(tracker停止・フレーム途絶対策)。0以下で無効

    # 指令のスルーレート制限(ガタつき防止)
    max_linear_accel: 0.5         # 並進速度の変化率上限(m/s^2)。↓で滑らか
    max_angular_accel: 2.0        # 角速度の変化率上限(rad/s^2)
