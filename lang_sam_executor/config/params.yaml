# リモートPC(GPU)で起動: lang_sam_detector.launch.py
lang_sam_detector:
  ros__parameters:
    sam_model: sam2.1_hiera_small
    text_prompt: "red pylon."
    box_threshold: 0.3            # 検出(BBox)の信頼度閾値。↑で厳格、↓で検出増(誤検出も増)
    text_threshold: 0.25          # テキスト一致の閾値。↑で厳格、↓で検出増
    request_topic: /lang_sam/detect_request
    response_topic: /lang_sam/detections

# ロボット側PCで起動: lang_sam_tracker.launch.py
lang_sam_tracker:
  ros__parameters:
    detection_interval_sec: 10.0   # 検出リクエスト送信間隔(秒)。↓で頻繁に再検出(通信・計算増=ドリフト矯正頻度↑)
    image_topic: /image_raw        # 画像トピック名
    detect_request_topic: /lang_sam/detect_request   # lang_sam_detectorへ送るトピック(要 同一ROS_DOMAIN_ID)
    detect_response_topic: /lang_sam/detections       # lang_sam_detectorから受け取るトピック
    detect_timeout_multiplier: 3.0  # 検出応答タイムアウト = detection_interval_sec × この倍率

    # Cutie (VOSマスク伝播トラッカー)
    cutie_weights: ""             # 重みファイルパス。空なら~/.cache/cutie/に自動ダウンロード
    cutie_max_internal_size: 480  # 内部処理解像度の最小辺(px)。↓で高速/粗い、↑で精細/遅い。480が標準
    cutie_mem_every: 5            # メモリ記銘の間隔(フレーム)。↓で頑健/メモリ増、↑で軽量
    cutie_use_long_term: true     # 長期メモリ。長時間追跡でのメモリ肥大を抑制
    cutie_use_amp: false          # 混合精度(FP16)で高速化。精度は僅かに低下

    # トラック管理 (再検出とのマージ規則)
    merge_iou_threshold: 0.1          # 検出マスクと既存トラックを同一とみなすIoU。↑で厳格(ID分裂しやすい)、↓で緩い(誤マージ増)
    duplicate_overlap_threshold: 0.5  # 同一物体の多重登録とみなす重なり率(交差/小さい方の面積)。検出同士・新規vs既存の両方に適用。↓で厳格(重複減)
    track_max_detection_misses: 3     # 再検出で連続この回数裏付けがないトラックを削除(3回×2秒=約6秒)
    track_lost_frames: 90             # 伝播マスクが空のままこのフレーム数を超えたら削除(遮蔽・画面外対策)
    track_min_mask_area: 100          # これ未満の面積(px)のマスクは消失扱い(多重登録の残骸や誤伝播を淘汰)

lang_sam_person_following:
  ros__parameters:
    image_width: 640   # 画像の幅(使用)
    kp_angular: 0.002  # 角速度の比例ゲイン(使用)
